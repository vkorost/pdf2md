[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Convert PDFs to Markdown — auto-routes between text extraction and OCR"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.10",
]

[project.optional-dependencies]
marker   = ["marker-pdf>=1.0"]
ocrmypdf = ["ocrmypdf>=16"]
paddle   = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
all      = ["marker-pdf>=1.0", "ocrmypdf>=16", "paddleocr>=2.7", "paddlepaddle>=2.6"]
dev      = ["pytest>=8.0"]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2md*"]
